name: Build Clocky with arm64_32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout Clocky (source already contains arm64_32 fix)
        uses: actions/checkout@v4
        with:
          repository: pookjw/Clocky
          ref: main

      - name: Show available Xcode versions
        run: ls -d /Applications/Xcode*.app

      - name: Downgrade project format for Xcode 16 (Intel runner)
        run: |
          sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' Clocky.xcodeproj/project.pbxproj
          sed -i '' 's/LastUpgradeCheck = 2730;/LastUpgradeCheck = 1600;/' Clocky.xcodeproj/project.pbxproj
          echo "=== format fields after downgrade ==="
          grep -nE 'objectVersion|LastUpgradeCheck' Clocky.xcodeproj/project.pbxproj

      - name: Strip Xcode-26-only arch from private framework tbd stubs
        run: |
          echo "Removing arm64e.x1-watchos architecture declaration from all .tbd stubs..."
          find . -name '*.tbd' -print0 | xargs -0 sed -i '' 's/, arm64e\.x1-watchos//g'
          echo "=== remaining target lines ==="
          grep -rh '^targets:' --include='*.tbd' . | sort -u

      - name: Verify arm64_32 is in the build settings
        run: grep -n "arm64_32" Clocky.xcodeproj/project.pbxproj

      - name: Build unsigned IPA via the official script
        run: |
          chmod +x scripts/create_ipa.sh
          bash scripts/create_ipa.sh \
            --bundle-id com.example.Clocky \
            --output build/ipa/Clocky-arm64_32.ipa

      - name: Inspect embedded Watch binary (informational)
        run: |
          IPA="build/ipa/Clocky-arm64_32.ipa"
          UNZIP_DIR=$(mktemp -d)
          unzip -q "$IPA" -d "$UNZIP_DIR"
          echo "=== IPA contents ==="
          find "$UNZIP_DIR" -type f -path '*Watch*' -name 'Clocky' -print -exec lipo -info {} \; || true

      - name: Upload the fixed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Clocky-arm64_32-fixed
          path: build/ipa/Clocky-arm64_32.ipa
          if-no-files-found: error
          retention-days: 30
